<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanças</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="application-name" content="Finanças"><meta name="apple-mobile-web-app-title" content="Finanças"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0C0C0E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app mobile de coluna única (480px), cabeçalho fixo com título centralizado, barra de navegação inferior com botão central de lançamento; edição em bottom sheet. */
:root{
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --h:255; --ck:1; --ak:1; --al:.52;
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#10141C; --ink-2:#4B5565; --line:#DDE2EB;
  --accent:oklch(var(--al) calc(.15*var(--ak)) var(--h)); --on-accent:#FFFFFF;
  --good:#1B8553; --warn:#A86A0A; --bad:#C23A3A; --track:#C5CCD9; --knob:#FFFFFF;
  --accent-soft:color-mix(in oklab, var(--accent) 12%, var(--surface));
  --chip-bg-l:.93; --chip-bg-c:.045; --chip-fg-l:.45; --chip-fg-c:.13; --sw-l:.66;
  --scrim:rgba(10,14,22,.45);
  --g1:#606261; --g2:#837777; --g3:#AD9D9E; --g4:#A1A1A1; --g5:#777B84; --g6:#8C8B99; --g7:#939182;
  --pv-l-bg:#EEF1F6; --pv-l-card:#FFFFFF; --pv-d-bg:#0C0F15; --pv-d-card:#1B212C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F15; --surface:#151A23; --surface-2:#1B212C; --ink:#EEF1F7; --ink-2:#9AA5B8; --line:#262E3B;
  --accent:oklch(0.80 calc(.15*var(--ak)) var(--h)); --on-accent:#0A0F18;
  --good:#4CC38A; --warn:#E8B04B; --bad:#FF8080; --track:#3A4454; --knob:#EEF1F7;
  --chip-bg-l:.30; --chip-bg-c:.06; --chip-fg-l:.84; --chip-fg-c:.12; --sw-l:.72;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151A23; --surface-2:#1B212C; --ink:#EEF1F7; --ink-2:#9AA5B8; --line:#262E3B;
  --accent:oklch(0.80 calc(.15*var(--ak)) var(--h)); --on-accent:#0A0F18;
  --good:#4CC38A; --warn:#E8B04B; --bad:#FF8080; --track:#3A4454; --knob:#EEF1F7;
  --chip-bg-l:.30; --chip-bg-c:.06; --chip-fg-l:.84; --chip-fg-c:.12; --sw-l:.72;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);
  padding-block:0 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* cabeçalho: sempre três colunas, assim o título fica no centro exato */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 10px}
.hrow{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.hrow .mid{text-align:center;min-width:0}
h1{font:700 24px/1.15 var(--font-display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.hsub{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.hbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;background:none;color:var(--ink)}
.hbtn.bordered{border:1px solid var(--line);background:var(--surface)}
.month{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin-top:10px}
.month b{font:700 17px/1 var(--font-display);text-align:center}
h2{font:700 18px/1.2 var(--font-display);letter-spacing:-.01em;margin:0}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:22px 14px 8px}
.hint{font-size:13px;color:var(--ink-2);margin:8px 14px 0;text-align:center}
.err{font-size:13px;color:var(--bad);margin:6px 2px 0}
.err:empty{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-h .sub{font-size:13px;color:var(--ink-2)}
.card-h>div{min-width:0}
.card-h>.diff{flex:none;white-space:nowrap;text-align:right}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px;text-align:center}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cols .v{font:700 18px/1.25 var(--font-display);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.cols.c3 .v{font-size:16px}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)}
.bar-t{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.bar-t i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .2s}
.bar-t i.good{background:var(--good)} .bar-t i.warn{background:var(--warn)} .bar-t i.bad{background:var(--bad)}
.diff{font-size:13px;font-weight:600;color:var(--ink-2)}
.diff.good{color:var(--good)} .diff.warn{color:var(--warn)} .diff.bad{color:var(--bad)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1}
.pill.good{background:color-mix(in oklab,var(--good) 16%,var(--surface));color:var(--good)}
.pill.warn{background:color-mix(in oklab,var(--warn) 18%,var(--surface));color:var(--warn)}
.pill.bad{background:color-mix(in oklab,var(--bad) 16%,var(--surface));color:var(--bad)}
.mask .cols .v,.mask .brow-v,.mask .diff,.mask .pre input,.mask [data-real],.mask .row-s .num,.mask .sum b,.mask .tile .v,.mask .hero .big,.mask .tx-v,.mask [data-cap],.mask .cb-top b,.mask .day-h b{filter:blur(7px)}

.chip{--ch:200;flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:12px;
  background:oklch(var(--chip-bg-l) calc(var(--chip-bg-c)*var(--ck)) var(--ch));color:oklch(var(--chip-fg-l) calc(var(--chip-fg-c)*var(--ck)) var(--ch))}
.chip.big{width:52px;height:52px;border-radius:16px}
.chip.big svg{width:26px;height:26px}
.lines{margin-top:14px;border-top:1px solid var(--line)}
.line{padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0;padding-bottom:0}
.line-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.line-name{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-height:44px;text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere}
.line-h .diff,.line-h .pill{text-align:right}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span:first-child,.field>label,legend{font-size:12px;font-weight:600;color:var(--ink-2);padding:0}
.pre{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;min-width:0}
.pre>span{color:var(--ink-2);font-weight:600;font-size:14px;flex:none}
.pre input{border:0;background:none;min-height:46px;padding:0;width:100%;min-width:0;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.pre:focus-within{outline:2px solid var(--accent)}
.pre input:focus{outline:0}
.pre:has(input[aria-invalid="true"]){border-color:var(--bad)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;margin-top:12px;border-radius:12px;border:1px dashed var(--track);background:none;font-weight:600;color:var(--ink-2)}
.add:hover{background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-align:center;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.mini{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;text-align:center}
.note{display:flex;gap:10px;font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:12px 0 0;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}

.group{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:10px 14px;background:none;border:0;text-align:left}
.row+.row,.row+.dep,.dep>.row:first-child{border-top:1px solid var(--line)}
.row.static{cursor:default}
a.row:hover,button.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-t{font-weight:600;overflow-wrap:anywhere}
.row-s{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.chev{color:var(--ink-2);flex:none;display:grid}
.row select,.row input[type=time]{width:auto;min-width:110px;max-width:55%}
.brow{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;min-height:64px}
.brow+.brow{border-top:1px solid var(--line)}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;padding:0}
.check i{width:26px;height:26px;border-radius:50%;border:2px solid var(--track);display:grid;place-items:center;color:var(--on-accent)}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.brow-main{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:0;text-align:left;padding:6px 0;min-height:44px;justify-content:center}
.brow-t{font-weight:600;overflow-wrap:anywhere}
.brow-s{font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brow-v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.brow.paid .brow-t,.brow.paid .brow-v{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1px}

.me-card{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:20px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:6px}
.me-n{font:700 20px/1.2 var(--font-display);margin-top:8px;overflow-wrap:anywhere}
.av{--ch:270;flex:none;display:grid;place-items:center;border-radius:50%;font:700 24px/1 var(--font-display);width:72px;height:72px;
  background:oklch(var(--chip-bg-l) calc(var(--chip-bg-c)*var(--ck)) var(--ch));color:oklch(var(--chip-fg-l) calc(var(--chip-fg-c)*var(--ck)) var(--ch))}
.av.xl{width:88px;height:88px;font-size:32px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}

.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
input[type=text],input[type=email],input[type=time],input[type=password],select{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hrow-pre{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding-left:12px}
.hrow-pre span{color:var(--ink-2);font-weight:600}
.hrow-pre input{border:0;background:none;border-radius:0 12px 12px 0}
.hrow-pre:focus-within{outline:2px solid var(--accent)}
.hrow-pre input:focus{outline:0}
fieldset{border:0;margin:16px 0 0;padding:0;min-width:0}
legend{margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:40px;border:0;background:none;border-radius:10px;font-weight:600;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.count{font-weight:500;font-size:12px;opacity:.7;margin-left:4px}
.switch{flex:none;width:48px;height:28px;border-radius:99px;border:0;background:var(--track);position:relative;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-weight:600}
.sum{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 14px 12px;color:var(--ink-2);font-size:14px}
.sum b{font:700 18px/1 var(--font-display);color:var(--ink);font-variant-numeric:tabular-nums}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sug{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px 0 8px;border-radius:99px;border:1px dashed var(--track);background:none;font-weight:500}
.sug:hover{background:var(--surface-2)}
details.arch{margin-top:16px}
details.arch summary{cursor:pointer;color:var(--ink-2);font-weight:600;padding:8px 14px;min-height:44px;display:flex;align-items:center}
.row.arc .row-t{color:var(--ink-2)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.theme{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--surface);text-align:center;font-weight:600;font-size:13px;align-items:stretch}
.theme[aria-pressed="true"]{border-color:var(--accent)}
.pv{height:62px;border-radius:10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.pv i{position:absolute;left:8px;right:8px;height:12px;border-radius:5px}
.pv i:nth-child(1){top:10px;width:55%;background:var(--accent)}
.pv i:nth-child(2){top:30px}
.pv i:nth-child(3){top:46px;right:30%}
.pv-light{background:var(--pv-l-bg)} .pv-light i:nth-child(n+2){background:var(--pv-l-card)}
.pv-dark{background:var(--pv-d-bg)} .pv-dark i:nth-child(n+2){background:var(--pv-d-card)}
.pv-auto{background:linear-gradient(115deg,var(--pv-l-bg) 50%,var(--pv-d-bg) 50%)}
.pv-auto i:nth-child(2){background:linear-gradient(115deg,var(--pv-l-card) 50%,var(--pv-d-card) 50%)}
.pv-auto i:nth-child(3){background:var(--pv-d-card)}
.swatches{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sw{--ch:160;width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--sw-hex,oklch(var(--sw-l) calc(.16*var(--ck)) var(--ch)));padding:0}
.sw[aria-pressed="true"],.sw[aria-checked="true"]{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.sw-l{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.goal-h{display:flex;justify-content:space-between;gap:12px;font-weight:600}
textarea{width:100%;min-height:120px;margin-top:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}

.cc-h{display:flex;align-items:center;gap:12px}
.cc-h .t{flex:1;min-width:0}
.cc-h b{display:block;font:700 17px/1.2 var(--font-display);overflow-wrap:anywhere}
.cc-h small{color:var(--ink-2);font-size:13px}
.cc-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.1;min-width:0}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.nav .fab{justify-self:center;align-self:center;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 16px rgba(0,0,0,.25),0 0 0 5px var(--surface)}
.subtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-top:10px}
.subtabs a{min-height:38px;display:grid;place-items:center;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-align:center}
.subtabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hero{text-align:center;padding:22px 16px}
.hero .k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hero .big{font:700 38px/1.1 var(--font-display);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .big.pos{color:var(--good)} .hero .big.neg{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;min-width:0}
.tile .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font:700 19px/1.25 var(--font-display);margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.lab{display:flex;justify-content:space-between;align-items:center;margin:22px 14px 8px}
.lab .label{margin:0}
.lab a{font-size:13px;font-weight:600;color:var(--accent);min-height:32px;display:inline-flex;align-items:center}
.cb{display:flex;align-items:center;gap:12px;padding:8px 0}
.cb-main{flex:1;min-width:0}
.cb-top{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.cb-bar{--ch:200;height:8px;border-radius:99px;background:var(--surface-2);margin-top:6px;overflow:hidden}

var state=load();
function load(){var d=defaults();try{var raw=localStorage.getItem(KEY),mig=false;if(!raw){raw=localStorage.getItem(OLDKEY);mig=!!raw;}if(raw){var s=JSON.parse(raw);
  if(s&&s.cats&&Array.isArray(s.cats.inc)&&Array.isArray(s.cats.exp)&&s.budget&&Array.isArray(s.bills)&&Array.isArray(s.cards)&&Array.isArray(s.tx)){
    ['profile','prefs','notif','security'].forEach(function(k){if(s[k]&&typeof s[k]==='object')Object.assign(d[k],s[k]);});
    if(s.theme)d.theme=s.theme;if(!s.dsg)d.theme='dark';if(s.accent)d.accent=s.accent;
    d.cats=s.cats;d.budget=s.budget;d.bills=s.bills;d.cards=s.cards;d.tx=s.tx;
    if(mig&&d.accent==='menta')d.accent='azul';
    migrateCaps(d);delete d.security.bio;delete d.security.pin;
    if(Array.isArray(s.accounts))d.accounts=s.accounts;
    if(s.plan&&typeof s.plan==='object')Object.assign(d.plan,s.plan);
    if(Array.isArray(s.home)){var ids=d.home.map(function(w){return w.id;}),have=s.home.filter(function(w){return ids.indexOf(w.id)>-1;});
      d.home.forEach(function(w){if(!have.some(function(x){return x.id===w.id;}))have.push(w);});d.home=have;}
    if(Array.isArray(s.log))d.log=s.log;if(s.last&&typeof s.last==='object')d.last=s.last;
    if(s.notified&&typeof s.notified==='object')d.notified=s.notified;if(Array.isArray(s.inbox))d.inbox=s.inbox;}}}catch(e){}return d;}
function migrateCaps(d){
  var keys=Object.keys(d.budget||{}).sort().reverse(),base=0;
  for(var i=0;i<keys.length&&!base;i++){var b=d.budget[keys[i]];d.cats.inc.forEach(function(c){base+=(b[c.id]&&b[c.id].p)||0;});}
  d.cats.exp.forEach(function(c){if(c.pct==null){c.pct=c.cap>0&&base>0?Math.round(c.cap/base*1000)/10:0;}delete c.cap;});
  d.cats.inc.forEach(function(c){delete c.cap;});
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}try{AutoBak.tick();Notify.soon();}catch(e){}}
function getP(p){return p.split('.').reduce(function(o,k){return o&&o[k];},state);}
function setP(p,v){var a=p.split('.'),k=a.pop(),o=a.reduce(function(o,x){return o[x];},state);o[k]=v;save();}

/* ---------- acesso aos dados ---------- */
function actives(t){return state.cats[t].filter(function(c){return !c.archived;});}
function findCat(id){return state.cats.inc.concat(state.cats.exp).filter(function(c){return c.id===id;})[0];}
function catName(id){var c=findCat(id);return c?c.name:'Sem categoria';}
function monthTx(key){return state.tx.filter(function(t){return t.date.slice(0,7)===key;});}
function realOf(id){var k=vk(),s=0;state.tx.forEach(function(t){if(t.catId===id&&t.status==='paid'&&t.date.slice(0,7)===k)s+=t.amount;});return r2(s);}
function totalReal(type){var k=vk(),s=0;state.tx.forEach(function(t){if(t.type===type&&t.status==='paid'&&t.date.slice(0,7)===k)s+=t.amount;});return r2(s);}
function totalPending(type){var k=vk(),s=0;state.tx.forEach(function(t){if(t.type===type&&t.status!=='paid'&&t.date.slice(0,7)===k)s+=t.amount;});return r2(s);}
function getVal(id,f){if(f==='r')return realOf(id);var b=state.budget[vk()];return (b&&b[id]&&b[id][f])||0;}
function entry(id){var k=vk();if(!state.budget[k])state.budget[k]={};if(!state.budget[k][id])state.budget[k][id]={p:0};return state.budget[k][id];}
function sum(t,f){if(f==='r')return totalReal(t);return r2(actives(t).reduce(function(s,c){return s+getVal(c.id,f);},0));}
function invGet(c){return (c.inv&&c.inv[vk()])||{v:0,paid:false};}
function invSet(c){if(!c.inv)c.inv={};if(!c.inv[vk()])c.inv[vk()]={v:0,paid:false};return c.inv[vk()];}
function hasBudget(){var b=state.budget[vk()];return !!b&&Object.keys(b).some(function(k){return b[k].p;});}
function billBy(id){return state.bills.filter(function(b){return b.id===id;})[0];}
function cardBy(id){return state.cards.filter(function(b){return b.id===id;})[0];}

var PLANS=[['503020','Equilibrado','50% necessidades · 30% desejos · 20% guardar',20],['502030','Guardar mais','50% necessidades · 20% desejos · 30% guardar',30],['601030','Mais folga','60% necessidades · 30% desejos · 10% guardar',10],['custom','Personalizado','Você escolhe quanto guardar',null]];
var CAT_W={e1:30,e2:18,e3:8,e4:10,e5:8,e6:8,e7:8,e8:4};
var ACCT_TYPES={corrente:'Conta corrente',poupanca:'Poupança',carteira:'Carteira',invest:'Investimentos'};
function suggestList(save){
  var cs=actives('exp'),w=cs.map(function(c){return CAT_W[c.id]||5;}),tw=w.reduce(function(a,b){return a+b;},0),spend=100-save;
  return cs.map(function(c,i){return {c:c,pct:Math.round(spend*w[i]/tw*2)/2};});
}
function suggestCaps(){suggestList(state.plan.save).forEach(function(x){x.c.pct=x.pct;});}
function applyIncome(){
  var inc=state.profile.income;if(!(inc>0))return;
  var k=mkey(today.getFullYear(),today.getMonth()),c=actives('inc')[0];if(!c)return;
  if(!state.budget[k])state.budget[k]={};if(!state.budget[k][c.id])state.budget[k][c.id]={p:0};state.budget[k][c.id].p=inc;
}
function defAcct(){var a=state.accounts.filter(function(x){return !x.archived;})[0];return a?a.id:'';}
function acctBy(id){return state.accounts.filter(function(a){return a.id===id;})[0];}
function txAcct(t){return (t.accountId!==undefined&&t.accountId!==null)?t.accountId:(t.method==='cartao'?'':defAcct());}
function acctBal(a){var b=a.balance0||0;state.tx.forEach(function(t){if(t.status==='paid'&&txAcct(t)===a.id)b+=t.type==='inc'?t.amount:-t.amount;});return r2(b);}
function totalBal(){return r2(state.accounts.reduce(function(s2,a){return s2+acctBal(a);},0));}
function histRows(){
  var cur=mkey(today.getFullYear(),today.getMonth()),m={};
  state.tx.forEach(function(t){var k=t.date.slice(0,7);if(k===cur||t.status!=='paid')return;if(!m[k])m[k]={inc:0,exp:0};m[k][t.type]+=t.amount;});
  return Object.keys(m).sort().reverse().map(function(k){return {k:k,inc:r2(m[k].inc),exp:r2(m[k].exp)};});
}
function monthTxt(k){var s2=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(+k.slice(0,4),+k.slice(5,7)-1,1));return s2.charAt(0).toUpperCase()+s2.slice(1);}

/* Livro de lançamentos: único ponto de escrita dos lançamentos.
   Cada registro tem id, rev, source e carimbos de data, e cada escrita entra no log.
   Isso deixa a base pronta para um agente externo ler e escrever depois, sem mexer nas telas. */
function logOp(op,id,by){state.log.push({ts:new Date().toISOString(),op:op,id:id,by:by||'app'});if(state.log.length>200)state.log=state.log.slice(-200);}
var Ledger={
  get:function(id){return state.tx.filter(function(t){return t.id===id;})[0];},
  add:function(t){var now=new Date().toISOString();if(t.accountId===undefined)t.accountId=t.method==='cartao'?'':defAcct();t.id=newId();t.source='app';t.createdAt=now;t.updatedAt=now;t.rev=1;state.tx.push(t);logOp('add',t.id,'app');save();return t;},
  update:function(id,patch){var t=this.get(id);if(!t)return null;Object.keys(patch).forEach(function(k){t[k]=patch[k];});t.updatedAt=new Date().toISOString();t.rev=(t.rev||1)+1;logOp('update',id,'app');save();return t;},
  remove:function(id){state.tx=state.tx.filter(function(t){return t.id!==id;});logOp('remove',id,'app');save();}
};

/* ---------- cálculos de exibição ---------- */
function diffInfo(t,p,r){
  if(!p&&!r)return {text:'Sem lançamentos',cls:''};
  if(t==='exp'){
    if(!p)return {text:fmt(r)+' sem previsto',cls:'warn'};
    if(r>p)return {text:fmt(r2(r-p))+' acima',cls:'bad'};
    return {text:fmt(r2(p-r))+' de folga',cls:'good'};
  }
  if(!p)return {text:fmt(r)+' não previsto',cls:'good'};
  if(r>=p)return {text:r>p?fmt(r2(r-p))+' a mais':'Meta batida',cls:'good'};
  return {text:'Faltam '+fmt(r2(p-r)),cls:''};
}
function barInfo(t,p,r){
  var ratio=p>0?r/p:(r>0?1.01:0),w=Math.min(100,ratio*100),cls='';
  if(t==='exp'){cls=ratio>1?'bad':(ratio>=.85?'warn':'');}else{cls=ratio>=1?'good':'';}
  return {w:w,cls:cls};
}
function setBar(el,w,cls){if(!el)return;el.style.width=w+'%';el.className=cls||'';}
function setDiff(el,info){if(!el)return;el.textContent=info.text;el.className='diff '+info.cls;}
function warnPct(){return state.notif.budgetPct||80;}

function colorOf(h){var g=greyOf(h);return g?g.hex:'oklch(.68 .15 '+h+')';}
function catItems(t){return state.cats[t].map(function(c){return {c:c,v:realOf(c.id)};}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;});}
function donutCard(title,sub,items,total){
  if(!items.length)return '<section class="card"><h2 class="center-h">'+title+'</h2><p class="hint" style="margin:10px 0 0">Sem lançamentos neste mês.</p></section>';
  var segs=items.slice(0,6).map(function(x){return {v:x.v,hue:x.c.hue,name:x.c.name};}),rest=r2(total-segs.reduce(function(a,x){return a+x.v;},0));
  if(rest>0.004)segs.push({v:rest,hue:1004,name:'Outras'});
  var acc=0,svg='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--surface-2)" stroke-width="5.2"/>';
  segs.forEach(function(x){var pc=x.v/total*100,len=Math.max(0,pc-(segs.length>1?.8:0));svg+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+colorOf(x.hue)+'" stroke-width="5.2" stroke-dasharray="'+len+' '+(100-len)+'" stroke-dashoffset="'+(25-acc)+'"/>';acc+=pc;});
  return '<section class="card" aria-label="'+title+'"><h2 class="center-h">'+title+'</h2><p class="hint" style="margin:2px 0 0">'+sub+'</p><div class="donut-wrap"><svg viewBox="0 0 42 42" class="donut" role="img" aria-label="'+title+'">'+svg+'<text x="21" y="21.2" text-anchor="middle">'+fmt(total)+'</text><text x="21" y="25.6" text-anchor="middle" class="d-s">no mês</text></svg>'+
   '<div class="legend">'+segs.map(function(x){return '<div class="lg"><i style="background:'+colorOf(x.hue)+'"></i><span>'+esc(x.name)+'</span><small>'+Math.round(x.v/total*100)+'%</small><b>'+fmt(x.v)+'</b></div>';}).join('')+'</div></div></section>';
}

function liveOrcamento(){
  ['inc','exp'].forEach(function(t){
    var card=$('#card-'+t);if(!card)return;
    var p=sum(t,'p'),r=sum(t,'r');
    setText('[data-tp]',fmt(p),card);setText('[data-tr]',fmt(r),card);
    setDiff($('[data-tdiff]',card),diffInfo(t,p,r));
    var bi=barInfo(t,p,r);setBar($('[data-tbar]',card),bi.w,bi.cls);
    actives(t).forEach(function(c){
      var row=$('[data-row="'+c.id+'"]',card);if(!row)return;
      var cp=getVal(c.id,'p'),cr=getVal(c.id,'r');
      setDiff($('[data-diff]',row),diffInfo(t,cp,cr));
      setText('[data-real]',fmt(cr),row);
      var b=barInfo(t,cp,cr);setBar($('[data-bar]',row),b.w,b.cls);
    });
  });
  var rp=r2(sum('inc','p')-sum('exp','p')),rr=r2(sum('inc','r')-sum('exp','r'));
  [['#res-p',rp],['#res-r',rr]].forEach(function(x){var el=$(x[0]);if(el){el.textContent=fmt(x[1]);el.className='v '+(x[1]>0?'pos':(x[1]<0?'neg':''));}});
}

/* ---------- CONTAS FIXAS ---------- */
function billStatus(b){
  if(b.paid&&b.paid[vk()])return 'paid';
  var c=monthsFromToday();if(c<0)return 'late';
  if(c===0&&effDay(b.day)<today.getDate())return 'late';
  return 'open';
}
function billRow(b){
  var st=billStatus(b),paid=st==='paid',tag='';
  if(st==='late')tag=' <span class="pill bad">Atrasada</span>';

/* ---------- TETOS ---------- */
function capBase(){return sum('inc','p');}
function capOf(c){var b=capBase();return c.pct>0&&b>0?r2(b*c.pct/100):0;}
function pctInput(id,val){return '<label class="fld"><span>Limite da receita</span><span class="pre"><input class="pctin" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Limite em porcentagem" data-id="'+id+'" value="'+(val?String(val).replace('.',','):'')+'"><span>%</span></span></label>';}
function capStatus(cap,r){
  if(!cap)return {txt:'Sem teto',cls:'',w:0,bar:''};
  var ratio=r/cap,w=Math.min(100,ratio*100);
  if(ratio>1)return {txt:'Estourou',cls:'bad',w:w,bar:'bad'};
  if(ratio*100>=warnPct())return {txt:'Perto do teto',cls:'warn',w:w,bar:'warn'};
  return {txt:'Dentro',cls:'good',w:w,bar:''};
}
function vTetos(){
  return '<div class="stats3" aria-label="Resumo dos tetos"><div class="stat"><div class="k">Limites</div><div class="v" id="t-pct"></div></div><div class="stat"><div class="k">Tetos</div><div class="v" id="t-cap"></div></div><div class="stat"><div class="k">Gasto real</div><div class="v" id="t-real"></div></div></div>'+
  '<section class="card" aria-label="Fatias da receita"><h2 class="center-h">Como sua renda se divide</h2><div class="stack" id="t-stack" role="img" aria-label="Fatias de cada categoria"></div><p class="hint" id="t-share" style="margin:10px 0 0"></p></section>'+
  actives('exp').map(function(c){
    return '<section class="card capc" data-row="'+c.id+'"><div class="top"><span class="nm"><span class="chip" style="'+chv(c.hue)+'">'+ic(c.icon,18)+'</span>'+esc(c.name)+'</span><span class="pill" data-pill></span></div>'+
    '<div class="vals"><b data-pct>0%</b><span data-cap></span></div>'+
    '<input type="range" class="slider capslide" min="0" max="'+Math.max(60,Math.ceil(c.pct||0))+'" step="0.5" value="'+(c.pct||0)+'" data-id="'+c.id+'" aria-label="Limite de '+esc(c.name)+' em porcentagem da receita">'+
    '<div class="bar-t"><i data-bar></i></div><div class="diff" data-sub style="margin-top:8px;text-align:center"></div></section>';}).join('')+
  '<p class="hint">Arraste a barra para aumentar ou diminuir a fatia da receita de cada categoria. O teto em reais é a fatia vezes a receita prevista. Aviso ao chegar em '+warnPct()+'% do teto e ao passar de 100%.</p>';
}
function liveTetos(){
  var caps=0,real=0,pcts=0,base=capBase(),segs='';
  actives('exp').forEach(function(c){
    var cap=capOf(c);caps+=cap;pcts+=c.pct||0;real+=getVal(c.id,'r');
    if(c.pct>0)segs+='<i style="width:'+c.pct+'%;background:'+colorOf(c.hue)+'" title="'+esc(c.name)+'"></i>';
    var row=$('[data-row="'+c.id+'"]');if(!row)return;
    var r=getVal(c.id,'r'),st=capStatus(cap,r);
    var pill=$('[data-pill]',row);pill.textContent=st.txt;pill.className='pill '+st.cls;
    setText('[data-pct]',String(c.pct||0).replace('.',',')+'%',row);
    setText('[data-cap]',cap?fmt(cap):'—',row);
    setBar($('[data-bar]',row),st.w,st.bar);
    var sub=$('[data-sub]',row);
    if(!(c.pct>0)){sub.textContent='Arraste a barra para definir um limite.';sub.className='diff';}
    else if(!base){sub.textContent='Defina a receita prevista para calcular o teto.';sub.className='diff';}
    else{var left=r2(cap-r);sub.textContent=left>=0?'Gasto '+fmt(r)+' · ainda dá para gastar '+fmt(left)+' ('+Math.round(r/cap*100)+'% usado)':'Gasto '+fmt(r)+' · passou '+fmt(-left)+' do teto';sub.className='diff '+(left>=0?(st.cls==='warn'?'warn':''):'bad');}
  });
  caps=r2(caps);real=r2(real);pcts=Math.round(pcts*10)/10;
  setText('#t-pct',String(pcts).replace('.',',')+'%');setText('#t-cap',fmt(caps));setText('#t-real',fmt(real));
  var st2=$('#t-stack');if(st2)st2.innerHTML=segs;
  var sh2=$('#t-share');if(sh2){
    sh2.textContent=base>0?'Receita prevista: '+fmt(base)+'. Sobra '+String(Math.round((100-pcts)*10)/10).replace('.',',')+'% para guardar.':'Sem receita prevista neste mês para calcular os tetos.';}
}

function dueInfo(c){
  var inv=invGet(c),dd=effDay(c.due);

var METHODS={pix:'Pix',debito:'Débito',dinheiro:'Dinheiro',cartao:'Cartão',boleto:'Boleto',transferencia:'Transferência'};
var WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],MO=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function dateOffset(n){var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+n);return dstr(d.getFullYear(),d.getMonth(),d.getDate());}
function dayLabel(ds){var y=+ds.slice(0,4),mm=+ds.slice(5,7)-1,d=+ds.slice(8,10);var w=new Date(y,mm,d).getDay();
  var tag=ds===todayStr()?'Hoje · ':(ds===dateOffset(-1)?'Ontem · ':'');return tag+WD[w]+', '+d+' '+MO[mm];}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}

function homeDrag(){
  var list=$('#hlist');if(!list)return;
  function moveTo(i0,i1){if(i0===i1)return;var it=state.home.splice(i0,1)[0];state.home.splice(i1,0,it);save();}
  list.addEventListener('keydown',function(e){
    var g=e.target.closest&&e.target.closest('.dgrip');if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
    e.preventDefault();var ids=state.home.map(function(w){return w.id;}),i=ids.indexOf(g.dataset.id),j=i+(e.key==='ArrowUp'?-1:1);
    if(i<0||j<0||j>=ids.length)return;moveTo(i,j);render(false);var ng=$('.dgrip[data-id="'+g.dataset.id+'"]');if(ng)ng.focus();});
  list.addEventListener('pointerdown',function(e){
    var g=e.target.closest&&e.target.closest('.dgrip');if(!g)return;
    e.preventDefault();
    var rows=$$('.drow',list),row=g.closest('.drow'),i0=rows.indexOf(row),idx=i0,y0=e.clientY;
    var tops=rows.map(function(r){return r.offsetTop;}),hs=rows.map(function(r){return r.offsetHeight;}),H=hs[i0];
    var minDy=tops[0]-tops[i0],maxDy=tops[rows.length-1]+hs[rows.length-1]-H-tops[i0];
    row.classList.add('dragging');rows.forEach(function(r){if(r!==row)r.classList.add('shift');});
    try{g.setPointerCapture(e.pointerId);}catch(x){}
    function mv(ev){
      var dy=Math.max(minDy,Math.min(maxDy,ev.clientY-y0)),cen=tops[i0]+H/2+dy;
      row.style.transform='translateY('+dy+'px)';
      idx=i0;
      for(var k=i0+1;k<rows.length;k++){if(cen>tops[k]+hs[k]/2)idx=k;}
      for(var k2=i0-1;k2>=0;k2--){if(cen<tops[k2]+hs[k2]/2)idx=k2;}
      rows.forEach(function(r,k){if(r===row)return;var s=0;
        if(idx>i0&&k>i0&&k<=idx)s=-H;else if(idx<i0&&k<i0&&k>=idx)s=H;
        r.style.transform=s?'translateY('+s+'px)':'';});
    }
    function up(){g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
      moveTo(i0,idx);render(false);}
    g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  });
}

function toHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}

function wizCollect(){
  var d=lk.d,g=function(id){var e=$('#'+id);return e?e.value:null;},v;
  if(lk.step===0){if((v=g('lk-u'))!==null)d.user=cleanUser(v);if((v=g('lk-n'))!==null)d.name=v.trim();if((v=g('lk-e'))!==null)d.email=v.trim();if((v=g('lk-p'))!==null)d.pw=v;if((v=g('lk-p2'))!==null)d.pw2=v;}
  if(lk.step===1){if((v=g('lk-city'))!==null)d.city=v.trim();if((v=g('lk-job'))!==null)d.job=v.trim();if((v=g('lk-inc'))!==null){var n=parseMoney(v);d.income=isNaN(n)?0:n;}}
}
function wizNext(){
  wizCollect();var d=lk.d,st=lk.step;
  if(st===0){
    if(!/^[a-z0-9._]{3,20}$/.test(d.user)){lkErr('Usuário: de 3 a 20 caracteres, letras minúsculas, números, ponto ou _.',true);return;}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){lkErr('Digite um e-mail válido, como nome@exemplo.com.',true);return;}
    if(d.pw.length<6){lkErr('A senha precisa ter pelo menos 6 caracteres.',true);return;}
    if(d.pw!==d.pw2){lkErr('As senhas não conferem.',true);return;}
  }
  if(st===1&&!(d.income>0)){lkErr('Informe sua renda mensal. Pode ser aproximada.',true);return;}
  if(st<5){lk.step++;renderLock();var f=$('#lock input');if(f)f.focus();return;}
  lk.busy=true;var salt=randHex(16);
  hashSecret(d.pw,salt,ALG).then(function(h){
    auth={user:d.user,alg:ALG,salt:salt,hash:h,pin:null,fails:0,lockUntil:0};saveAuth();
    var p=state.profile;p.handle=d.user;p.name=d.name||d.user;p.email=d.email;p.city=d.city;p.job=d.job;p.income=d.income;
    state.plan={method:d.method,save:d.save,mode:d.mode};applyIncome();suggestCaps();save();unlock();toast('Tudo pronto, '+p.name.split(' ')[0]+'!');
  }).catch(function(){lk.busy=false;lkErr('Não foi possível criar o acesso neste navegador.',true);});
}
function lkErr(msg,shake){var e=$('#lk-err');if(e)e.textContent=msg;if(shake){var c=$('#lock .lock-in');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}}
function lkSubmit(){
  if(lk.busy)return;var m=lk.mode;
  if(m==='setup'){wizNext();return;}
  if(m==='pw'){
    var wl=waitLeft();if(wl){lkErr('Muitas tentativas. Tente de novo em '+wl+'s.',true);return;}
    var u2=cleanUser($('#lk-u').value),p3=$('#lk-p').value;
    if(!u2||!p3){lkErr('Digite usuário e senha.',true);return;}
    lk.busy=true;
    checkSecret(p3,auth).then(function(ok){lk.busy=false;
      if(ok&&u2===auth.user){authOk();unlock();return;}
      var left=authFail();lkErr(waitLeft()?'Muitas tentativas. Tente de novo em '+waitLeft()+'s.':'Usuário ou senha incorretos.'+(left<5&&left>0?' Restam '+left+' tentativas.':''),true);
      var pe=$('#lk-p');if(pe){pe.value='';pe.focus();}})
    .catch(function(){lk.busy=false;lkErr('Não foi possível verificar a senha neste navegador.',true);});
  }
}
function lkDots(){var d=$$('#lk-dots i');d.forEach(function(x,i){x.className=i<lk.pin.length?'on':'';});var w=$('#lk-dots');if(w)w.setAttribute('aria-label','PIN, '+lk.pin.length+' de 4 números');}
function lkKey(n){
  if(lk.mode!=='pin'||lk.busy||lk.pin.length>=4)return;
  var wl=waitLeft();if(wl){lkErr('Muitas tentativas. Tente de novo em '+wl+'s.',true);return;}
  lkErr('',false);lk.pin+=n;lkDots();
  if(lk.pin.length===4){lk.busy=true;var typed=lk.pin;
    checkSecret(typed,auth.pin).then(function(ok){lk.busy=false;
      if(ok){authOk();unlock();return;}
      var left=authFail();lk.pin='';lkDots();lkErr(waitLeft()?'Muitas tentativas. Tente de novo em '+waitLeft()+'s.':'PIN incorreto.'+(left<5&&left>0?' Restam '+left+' tentativas.':''),true);})
    .catch(function(){lk.busy=false;lk.pin='';lkDots();lkErr('Não foi possível verificar o PIN.',true);});}
}

document.addEventListener('keydown',function(e){

function pwField(id,label,ac){return '<div class="field"><label for="'+id+'">'+label+'</label><input type="password" id="'+id+'" autocomplete="'+ac+'"></div>';}
function pinField(id,label){return '<div class="field"><label for="'+id+'">'+label+'</label><input type="password" id="'+id+'" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>';}
function openSec(op,opener){
  sh={kind:'sec',op:op};
  var T={pw:'Alterar senha','pin-new':'Criar PIN','pin-change':'Alterar PIN','pin-off':'Desligar PIN'}[op];
  var body=(op==='pin-new'?'<p class="hint" style="text-align:left;margin:8px 2px 0">Com o PIN você abre o app mais rápido. A senha continua valendo.</p>':'')+pwField('s-p0','Senha atual','current-password');
  if(op==='pw')body+=pwField('s-p1','Nova senha (mínimo 6 caracteres)','new-password')+pwField('s-p2','Repita a nova senha','new-password');
  if(op==='pin-new'||op==='pin-change')body+=pinField('s-n1','Novo PIN (4 números)')+pinField('s-n2','Repita o PIN');
  body+='<p class="err" id="s-err"></p><div class="sheet-actions"><button type="button" class="btn primary" data-act="save">'+(op==='pin-off'?'Desligar PIN':'Salvar')+'</button></div>';
  openSheet(T,body,opener);
}
function saveSec(){
  var err=$('#s-err');if(sh.busy)return;
  var wl=waitLeft();if(wl){err.textContent='Muitas tentativas. Tente de novo em '+wl+'s.';return;}
  var p0=$('#s-p0').value,op=sh.op,p1,n1;
  if(!p0){err.textContent='Digite sua senha atual.';$('#s-p0').focus();return;}
  if(op==='pw'){p1=$('#s-p1').value;
    if(p1.length<6){err.textContent='A nova senha precisa ter pelo menos 6 caracteres.';$('#s-p1').focus();return;}
    if(p1!==$('#s-p2').value){err.textContent='As senhas novas não conferem.';$('#s-p2').focus();return;}
    if(p1===p0){err.textContent='A nova senha precisa ser diferente da atual.';$('#s-p1').focus();return;}}
  if(op==='pin-new'||op==='pin-change'){n1=$('#s-n1').value;
    if(!/^\d{4}$/.test(n1)){err.textContent='O PIN tem 4 números.';$('#s-n1').focus();return;}
    if(n1!==$('#s-n2').value){err.textContent='Os PINs não conferem.';$('#s-n2').focus();return;}}
  sh.busy=true;
  function done(m){closeSheet();toast(m);render(false);}
  checkSecret(p0,auth).then(function(ok){
    if(!ok){sh.busy=false;authFail();err.textContent='Senha atual incorreta.';$('#s-p0').value='';$('#s-p0').focus();return;}
    authOk();
    if(op==='pw'){var salt=randHex(16);return hashSecret(p1,salt,ALG).then(function(h){auth.salt=salt;auth.hash=h;auth.alg=ALG;saveAuth();done('Senha alterada');});}
    if(op==='pin-off'){auth.pin=null;saveAuth();done('PIN desligado');return;}
    var ps=randHex(16);return hashSecret(n1,ps,ALG).then(function(h){auth.pin={salt:ps,alg:ALG,hash:h};saveAuth();done(op==='pin-new'?'PIN ativado':'PIN alterado');});
  }).catch(function(){if(sh){sh.busy=false;err.textContent='Não foi possível concluir neste navegador. Tente de novo.';}});
}

function saveSheet(){

function saveTx(){
  txCollect();var err=$('#s-err');
  if(!(sh.amount>0)){err.textContent='Digite o valor, por exemplo 25,90.';$('#s-amt').focus();return;}
  if(!sh.catId||!findCat(sh.catId)){err.textContent='Escolha uma categoria.';return;}
  if(sh.method==='cartao'&&!sh.cardId){err.textContent='Escolha o cartão.';return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(sh.date)){err.textContent='Escolha a data.';return;}
  var rec={type:sh.type,date:sh.date,amount:sh.amount,catId:sh.catId,desc:(sh.desc||'').trim()||catName(sh.catId),method:sh.method,cardId:sh.method==='cartao'?sh.cardId:'',accountId:sh.method==='cartao'?'':sh.accountId,status:sh.paid?'paid':'pending'};
  if(sh.id){Ledger.update(sh.id,rec);toast('Lançamento salvo');}
  else{rec.billId='';rec.note='';Ledger.add(rec);toast(sh.type==='exp'?'Despesa lançada':'Receita lançada');}
  if(!state.last)state.last={exp:'',inc:''};state.last[sh.type]=sh.catId;save();
  view.y=+sh.date.slice(0,4);view.m=+sh.date.slice(5,7)-1;
  closeSheet();render(false);
}
function copyCsv(){
  var rows=[['data','tipo','valor','categoria','descricao','forma','cartao','status','conta_fixa','id']];
  state.tx.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);}).forEach(function(t){var c=t.cardId?cardBy(t.cardId):null;
    rows.push([t.date,t.type==='inc'?'receita':'despesa',String(t.amount).replace('.',','),catName(t.catId),t.desc,METHODS[t.method]||t.method,c?c.name:'',t.status==='paid'?'efetivado':'pendente',t.billId||'',t.id]);});
  var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
  copyText(csv,'Lançamentos copiados');

function archiveCat(){

function deleteSheet(){
  if(!sh||!sh.id)return;
  if(sh.kind==='tx'){var tt=Ledger.get(sh.id);if(tt&&tt.billId){var bb=billBy(tt.billId);if(bb&&bb.paid)delete bb.paid[tt.date.slice(0,7)];}Ledger.remove(sh.id);}
  else if(sh.kind==='bill'){state.bills=state.bills.filter(function(b){return b.id!==sh.id;});}
  else if(sh.kind==='card'){state.cards=state.cards.filter(function(c){return c.id!==sh.id;});}
  else if(sh.kind==='acct'){state.accounts=state.accounts.filter(function(a){return a.id!==sh.id;});var nd=defAcct();state.tx.forEach(function(t){if(t.accountId===sh.id)t.accountId=t.method==='cartao'?'':nd;});}

function fallbackDownload(txt,name){try{var u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(u);},500);markExport();toast('Backup gerado');}catch(e){copyBackup();}}

    },function(){fallbackDownload(txt,name);});}else fallbackDownload(txt,name);

}

  try{
    if(navigator.share&&navigator.canShare){
      ['application/json','text/plain'].some(function(ty){try{var c=new File([txt],name,{type:ty});if(navigator.canShare({files:[c]})){f=c;return true;}}catch(e){}return false;});
      if(f){navigator.share({files:[f],title:'Backup do Finanças'}).then(function(){markExport();toast('Backup enviado');},function(e){if(e&&e.name==='AbortError')return;toast('Não foi possível compartilhar. Gerando o arquivo.');exportBackup();});return;}
    }
  }catch(e){}
  toast('Compartilhar não está disponível aqui. Gerando o arquivo.');exportBackup();
}
var pendingRestore=null;
function readBackup(text){
  var o;try{o=JSON.parse(String(text).trim());}catch(e){return null;}
  var env=!!(o&&o.app==='financas'),d=env?o.data:o;
  if(d&&d.cats&&Array.isArray(d.cats.inc)&&Array.isArray(d.cats.exp)&&d.budget&&Array.isArray(d.bills)&&Array.isArray(d.cards)&&Array.isArray(d.tx))return {data:d,auth:env?o.auth:null,at:env?o.exportedAt:''};
  return null;
}
function askRestore(text){
  var r=readBackup(text);if(!r){toast('Arquivo ou texto de backup inválido');return;}
  pendingRestore=r;
  if(locked){applyRestore();return;}
  openRestoreAsk(r);
}
function applyRestore(){
  var r=pendingRestore;if(!r)return;
  try{AutoBak.snap('antes de restaurar',true);}catch(e){}
  try{r.data.dsg=1;localStorage.setItem(KEY,JSON.stringify(r.data));if(r.auth)localStorage.setItem(AKEY,r.auth);}catch(e){toast('Não foi possível restaurar neste navegador');return;}
  toast('Backup restaurado');setTimeout(function(){location.reload();},350);
}
(function(){var f=document.createElement('input');f.type='file';f.id='bkFile';f.accept='.json,application/json,text/plain';f.hidden=true;document.body.appendChild(f);
  f.addEventListener('change',function(){var file=f.files&&f.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){askRestore(String(rd.result||''));};rd.onerror=function(){toast('Não foi possível ler o arquivo');};rd.readAsText(file);});})();

/* ---------- avisos e backup automático (lote 1) ---------- */
function withNow(fn){var sv={y:view.y,m:view.m};today=new Date();view.y=today.getFullYear();view.m=today.getMonth();try{return fn();}finally{view.y=sv.y;view.m=sv.m;}}
function ago(ts){var m=Math.round((Date.now()-ts)/60000);if(m<1)return 'agora';if(m<60)return 'há '+m+' min';var h=Math.round(m/60);if(h<24)return 'há '+h+' h';var d=Math.round(h/24);return d===1?'ontem':'há '+d+' dias';}
var Notify={
  to:0,
  supported:function(){return typeof Notification!=='undefined';},
  perm:function(){try{return Notify.supported()?Notification.permission:'unsupported';}catch(e){return 'unsupported';}},
  unread:function(){return (state.inbox||[]).filter(function(x){return !x.read;}).length;},
  any:function(){var n=state.notif;return !!(n.bills||n.budget||n.daily||n.weekly||n.backup);},
  ask:function(){var done=function(){if(routeName==='notificacoes')render(false);};
    try{var p=Notification.requestPermission(done);if(p&&p.then)p.then(done,done);}catch(e){done();}},
  show:function(title,body,tag){if(Notify.perm()!=='granted')return;try{new Notification(title,{body:body||'',tag:tag});}catch(e){}},
  push:function(key,title,body,sys,href){
    if(state.notified[key])return false;
    state.notified[key]=Date.now();
    state.inbox.unshift({id:newId(),ts:Date.now(),t:title,b:body,href:href||'',read:false});
    if(state.inbox.length>30)state.inbox.length=30;
    save();Notify.show(title,sys,key);return true;
  },
  soon:function(){clearTimeout(Notify.to);Notify.to=setTimeout(Notify.check,500);},
  check:function(){
    if(typeof locked!=='undefined'&&locked)return;
    var made=0;function P(k,t,b,s,h){if(Notify.push(k,t,b,s,h))made++;}
    withNow(function(){
      var n=state.notif,t0=today,td=todayStr(),mk=vk(),hm=pad(t0.getHours())+':'+pad(t0.getMinutes());
      var wd=(t0.getDay()+6)%7,ws=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()-wd),wk=dstr(ws.getFullYear(),ws.getMonth(),ws.getDate());
      if(n.bills){
        state.bills.forEach(function(b){var st=billStatus(b);if(st==='paid')return;var d=effDay(b.day)-t0.getDate();
          if(st==='late')P('bill:late:'+b.id+':'+mk,'Conta atrasada',b.name+' venceu dia '+effDay(b.day)+' ('+fmt(b.amount)+')','Você tem uma conta atrasada','contas');
          else if(d<=n.billsDays)P('bill:soon:'+b.id+':'+mk,d===0?'Conta vence hoje':'Conta perto de vencer',b.name+(d===0?' vence hoje':' vence em '+d+(d===1?' dia':' dias'))+' ('+fmt(b.amount)+')','Uma conta vence em breve','contas');});
        state.cards.forEach(function(c){var inv=invGet(c);if(!inv.v||inv.paid)return;var di=dueInfo(c);
          if(di.cls==='bad'||di.cls==='warn')P('inv:'+c.id+':'+mk,'Fatura do cartão '+c.name,di.txt+' ('+fmt(inv.v)+')','Uma fatura precisa de atenção','cartoes');});
      }
      if(n.budget){
        actives('exp').forEach(function(c){var cap=capOf(c);if(!cap)return;var r=realOf(c.id),pc=r/cap*100;
          if(pc>=100)P('cap:'+c.id+':'+mk+':100','Teto de '+c.name+' ultrapassado',fmt(r)+' de '+fmt(cap)+' ('+Math.round(pc)+'%)','Um teto foi ultrapassado','tetos');
          else if(pc>=n.budgetPct)P('cap:'+c.id+':'+mk+':'+n.budgetPct,c.name+' chegou a '+Math.round(pc)+'% do teto',fmt(r)+' de '+fmt(cap),'Uma categoria está perto do teto','tetos');});
      }
      if(n.daily&&hm>=n.dailyTime&&!state.tx.some(function(x){return x.date===td;}))
        P('daily:'+td,'Já lançou seus gastos de hoje?','Leva um minuto. Toque para lançar.','Hora de lançar seus gastos','lancamentos');
      if(n.weekly){
        var ps=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()-7),pk=dstr(ps.getFullYear(),ps.getMonth(),ps.getDate()),sp=0,by={};
        state.tx.forEach(function(x){if(x.type==='exp'&&x.status==='paid'&&x.date>=pk&&x.date<wk){sp+=x.amount;by[x.catId]=(by[x.catId]||0)+x.amount;}});
        if(sp>0){var top=Object.keys(by).sort(function(a,b){return by[b]-by[a];})[0];
          P('weekly:'+wk,'Resumo da semana','Você gastou '+fmt(r2(sp))+' na semana passada. Maior gasto: '+catName(top)+' ('+fmt(r2(by[top]))+').','Seu resumo da semana está pronto','inicio');}
      }
      if(n.backup&&state.tx.length){var le=state.prefs.lastExport||0,age=(Date.now()-le)/864e5;
        if(!le||age>=7)P('backup:'+wk,'Faça um backup em arquivo',le?'Faz '+Math.floor(age)+' dias que você não exporta seus dados.':'Você ainda não exportou seus dados em arquivo.','Exporte seus dados para não perdê-los','dados');}
      var old=Date.now()-1.04e10,dirty=false;Object.keys(state.notified).forEach(function(k){if(state.notified[k]<old){delete state.notified[k];dirty=true;}});if(dirty)save();
    });
    if(made){toast(made===1?'Novo aviso':made+' novos avisos');if(routeName==='inicio')renderHeader();}
  },
  test:function(){var t='Avisos funcionando',b='Este é um aviso de teste do Finanças.';
    state.inbox.unshift({id:newId(),ts:Date.now(),t:t,b:b,href:'',read:false});if(state.inbox.length>30)state.inbox.length=30;save();
    Notify.show(t,b,'teste');toast(Notify.perm()==='granted'?'Aviso enviado ao aparelho e ao sino':'Aviso enviado ao sino do Início');}
};
function openInbox(op){
  var L=state.inbox;sh={kind:'inbox'};
  var body=L.length?'<div class="group">'+L.map(function(x){var inner='<span class="row-main"><span class="row-t">'+esc(x.t)+'</span><span class="row-s">'+esc(x.b)+'</span></span><span class="row-s" style="flex:none">'+ago(x.ts)+'</span>';
    return x.href?'<a class="row" href="#'+x.href+'" data-act="close">'+inner+'</a>':'<div class="row static">'+inner+'</div>';}).join('')+'</div><div class="btn-row"><button type="button" class="btn" data-act="inbox-clear">Limpar avisos</button></div>':'<div class="empty">Nenhum aviso por enquanto.</div>';
  L.forEach(function(x){x.read=true;});save();
  openSheet('Avisos',body,op);renderHeader();
}

var BKEY='financas-bak-v1';
function whenLbl(iso){var d=new Date(iso),t=new Date(),y=new Date(t.getFullYear(),t.getMonth(),t.getDate()-1),hm=pad(d.getHours())+':'+pad(d.getMinutes()),ds=dstr(d.getFullYear(),d.getMonth(),d.getDate());
  if(ds===dstr(t.getFullYear(),t.getMonth(),t.getDate()))return 'Hoje, '+hm;if(ds===dstr(y.getFullYear(),y.getMonth(),y.getDate()))return 'Ontem, '+hm;return d.getDate()+' '+MO[d.getMonth()]+', '+hm;}
var AutoBak={
  last:'',
  list:function(){try{var o=JSON.parse(localStorage.getItem(BKEY)||'null');return o&&Array.isArray(o.items)?o.items:[];}catch(e){return [];}},
  put:function(items){while(true){try{localStorage.setItem(BKEY,JSON.stringify({v:1,items:items}));return true;}catch(e){if(!items.length)return false;items.pop();}}},
  hasData:function(){return !!(state.tx.length||state.accounts.length||state.bills.length||state.cards.length);},
  snap:function(why,force){
    if(!AutoBak.hasData())return;
    var items=AutoBak.list(),day=todayStr();
    if(why==='auto'&&items.some(function(x){return x.why==='auto'&&x.day===day;})){AutoBak.last=day;return;}
    items.unshift({at:new Date().toISOString(),day:day,why:why,n:state.tx.length,data:JSON.parse(JSON.stringify(state))});
    if(items.length>8)items.length=8;
    AutoBak.put(items);if(why==='auto')AutoBak.last=day;
  },
  tick:function(){if(typeof locked!=='undefined'&&locked)return;if(!state.prefs.autoBackup)return;var d=todayStr();if(AutoBak.last===d)return;AutoBak.snap('auto');},
  clear:function(){try{localStorage.removeItem(BKEY);}catch(e){}}
};
var WHY={auto:'Cópia automática','antes de apagar':'Antes de apagar os dados','antes de restaurar':'Antes de restaurar um backup'};
function markExport(){state.prefs.lastExport=Date.now();save();if(routeName==='dados')render(false);}
function openRestoreAsk(r){
  pendingRestore=r;
  var box=$('#restoreAsk');if(!box){applyRestore();return;}
  var when=r.at?new Date(r.at).toLocaleString('pt-BR'):'data desconhecida';
  box.hidden=false;box.innerHTML='<div class="warnbox"><b>Substituir seus dados por este backup?</b><p class="row-s" style="margin:6px 0 0">'+r.data.tx.length+' lançamentos · gerado em '+esc(when)+'</p><p class="err" style="display:block;text-align:center">Os dados atuais deste aparelho serão substituídos. Uma cópia deles fica guardada antes.</p><div class="btn-row"><button type="button" class="btn danger" data-act="restore-do">Sim, restaurar</button><button type="button" class="btn" data-act="restore-cancel">Cancelar</button></div></div>';
  try{box.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
}

route();
if(!$('#view').innerHTML)render(true);
lockApp(auth?(auth.pin?'pin':'pw'):'setup');
setInterval(function(){try{Notify.check();}catch(e){}},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){try{Notify.check();AutoBak.tick();}catch(e){}}});
window.addEventListener('scroll',function(){var h=$('#hdr');if(h)h.classList.toggle('scrolled',window.scrollY>4);},{passive:true});
})();
</script>

<script>
(function(){
var has=false;try{has=!!localStorage.getItem('financas-auth-v1');}catch(e){}
var sp=document.getElementById('splashC'),go=document.getElementById('spGo');
go.textContent=has?'Entrar':'Criar conta';
function out(){if(sp.classList.contains('out'))return;sp.classList.add('out');setTimeout(function(){sp.hidden=true;},550);}
if(/[?&]nosplash/.test(location.search)){sp.hidden=true;}else{sp.hidden=false;go.addEventListener('click',out);}
})();
(function(){window.__dir='fwd';document.addEventListener('click',function(e){window.__dir=(e.target.closest&&e.target.closest('[data-act="wz-back"]'))?'back':'fwd';},true);
var lock=document.getElementById('lock');new MutationObserver(function(){var c=lock.querySelector('.lock-in');if(c&&window.__dir==='back')c.classList.add('back');}).observe(lock,{childList:true});
function fmt(n){return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function count(){var el=document.querySelector('.hero .big');if(!el||el.dataset.c)return;var m=/^R\$ ([\d.]+),(\d{2})$/.exec(el.textContent.trim());if(!m)return;var to=parseFloat(m[1].replace(/\./g,'')+'.'+m[2]),t0=performance.now();el.dataset.c='1';
  (function step(t){var p=Math.min(1,(t-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(step);else el.textContent=fmt(to);})(t0);}
function fills(){document.querySelectorAll('input[type=range]').forEach(function(r){r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%');});}
function ramp(i,n){var x=n<2?100:100-i*(72/(n-1));return 'color-mix(in oklab,var(--accent) '+x.toFixed(0)+'%,var(--surface))';}
function recolor(){document.querySelectorAll('.donut-wrap').forEach(function(w){var cs=w.querySelectorAll('.donut circle:not(:first-child)'),ds=w.querySelectorAll('.lg i');cs.forEach(function(c,i){c.setAttribute('stroke',ramp(i,cs.length));});ds.forEach(function(d,i){d.style.background=ramp(i,ds.length);});});
  var st=document.getElementById('t-stack');if(st){var is=st.querySelectorAll('i');is.forEach(function(d,i){d.style.background=ramp(i,is.length);});}}
var v=document.getElementById('view');new MutationObserver(function(){count();fills();recolor();}).observe(v,{childList:true,subtree:true});
document.addEventListener('input',function(){fills();setTimeout(recolor,0);});count();fills();recolor();
new MutationObserver(fills).observe(lock,{childList:true,subtree:true});
})();
</script>
